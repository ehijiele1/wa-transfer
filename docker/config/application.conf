# Application Configuration
# This file contains configuration that is safe to be in the container

# Logging configuration
LOG_LEVEL=${LOG_LEVEL:-info}
ENABLE_CONSOLE_LOGGING=${ENABLE_CONSOLE_LOGGING:-true}
ENABLE_FILE_LOGGING=${ENABLE_FILE_LOGGING:-true}
LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs/app.log}
ENABLE_TRACING=${ENABLE_TRACING:-true}

# Health server configuration
ENABLE_HEALTH_SERVER=${ENABLE_HEALTH_SERVER:-true}
HEALTH_SERVER_PORT=${HEALTH_SERVER_PORT:-3001}
HEALTH_SERVER_HOST=${HEALTH_SERVER_HOST:-0.0.0.0}
ENABLE_CORS=${ENABLE_CORS:-true}

# Application settings
NODE_ENV=${NODE_ENV:-production}
PORT=${PORT:-3001}

# Monitoring intervals
MONITORING_GROUPS=${MONITORING_GROUPS}
MAX_MESSAGES_PER_GROUP=${MAX_MESSAGES_PER_GROUP:-100}
MESSAGE_PROCESSING_INTERVAL_MS=${MESSAGE_PROCESSING_INTERVAL_MS:-30000}
CONTENT_GENERATION_INTERVAL_MS=${CONTENT_GENERATION_INTERVAL_MS:-300000}
SOCIAL_MEDIA_INTERVAL_MS=${SOCIAL_MEDIA_INTERVAL_MS:-60000}

# Security settings
ENABLE_INPUT_VALIDATION=${ENABLE_INPUT_VALIDATION:-true}
ENABLE_URL_SANITIZATION=${ENABLE_URL_SANITIZATION:-true}
ENABLE_REQUEST_TIMEOUTS=${ENABLE_REQUEST_TIMEOUTS:-true}
REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-15000}

# Performance settings
MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-10}
ENABLE_CIRCUIT_BREAKER=${ENABLE_CIRCUIT_BREAKER:-true}
CIRCUIT_BREAKER_THRESHOLD=${CIRCUIT_BREAKER_THRESHOLD:-5}

# Data retention
LOG_RETENTION_HOURS=${LOG_RETENTION_HOURS:-168}  # 7 days
METRICS_RETENTION_HOURS=${METRICS_RETENTION_HOURS:-24}  # 1 day
SESSION_CLEANUP_HOURS=${SESSION_CLEANUP_HOURS:-24}  # 1 day
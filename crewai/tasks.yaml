# CrewAI Task Definitions for wa-transfer Remediation
# Tasks are executed in parallel where possible

tasks:
  # Task 1: Wire JobScheduler into index.ts
  wire_jobscheduler:
    name: Wire JobScheduler into Application Lifecycle
    description: >
      Update src/index.ts to properly integrate JobScheduler. Replace all 
      remaining setInterval calls with proper cron jobs from JobScheduler. 
      Ensure WhatsAppMonitoringApp.start() calls jobScheduler.start() and 
      stop() calls jobScheduler.stop(). Verify all imports resolve correctly.
    agent: integration_specialist
    expected_output: >
      src/index.ts fully wired to JobScheduler with no remaining setInterval 
      calls. Application starts and stops cleanly via JobScheduler.
    context: []

  # Task 2: Add circuit breakers to platform adapters
  add_circuit_breakers:
    name: Add Circuit Breakers to Platform Adapters
    description: >
      Wrap all fetch() calls in FacebookAdapter, TwitterAdapter, and 
      LinkedInAdapter with appropriate circuit breakers. Use 
      facebookCircuitBreaker, twitterCircuitBreaker, and linkedinCircuitBreaker 
      from src/utils/circuitBreaker.ts. Apply fetchWithTimeout with appropriate 
      timeouts (Facebook: 20s, Twitter: 15s, LinkedIn: 15s).
    agent: security_hardening_specialist
    expected_output: >
      All platform adapter fetch calls wrapped with circuit breakers and 
      timeouts. No raw fetch() calls remain in platform adapters.
    context: []

  # Task 3: Add validation to message processing
  add_input_validation:
    name: Integrate Input Validation into Message Processing
    description: >
      Add inputValidator to all message processing entry points in 
      src/services/messageProcessor.ts. Validate WhatsApp messages before 
      classification. Add SSRF protection to any URL fetching. Ensure 
      XSS patterns are detected and quarantined.
    agent: validation_specialist
    expected_output: >
      All message processing paths validated. Input validator integrated 
      with proper error handling and quarantine logic.
    context: []

  # Task 4: Write unit tests for utilities
  write_utility_tests:
    name: Write Unit Tests for New Utilities
    description: >
      Create test files for all new utility modules:
      - tests/utils/logger.test.ts
      - tests/utils/fetchWithTimeout.test.ts
      - tests/utils/circuitBreaker.test.ts
      - tests/utils/inputValidator.test.ts
      - tests/queues/queueManager.test.ts
      
      Each test file should cover:
      - Happy path
      - Error cases
      - Edge cases
      - Timeout behavior (for fetchWithTimeout)
      - Circuit breaker state transitions
      - Input validation rules
    agent: test_automation_engineer
    expected_output: >
      Test files created with >70% coverage for each utility module. 
      All tests passing.
    context: []

  # Task 5: Write integration tests
  write_integration_tests:
    name: Write Integration Tests for Critical Flows
    description: >
      Create integration tests for:
      - tests/integration/message-processing.test.ts (WhatsApp message → classification → DB)
      - tests/integration/publishing.test.ts (schedule post → queue → publish)
      - tests/integration/health-check.test.ts (all dependencies)
      
      Use test fixtures from tests/fixtures/.
      Mock external APIs (WhatsApp, Instagram, Facebook, Twitter, LinkedIn).
    agent: test_automation_engineer
    expected_output: >
      Integration tests passing with mocked external dependencies. 
      Critical flows verified end-to-end.
    context: []

  # Task 6: Add circuit breakers to Instagram media
  add_instagram_circuit_breakers:
    name: Add Circuit Breakers to Instagram Media Service
    description: >
      Wrap all fetch() calls in src/services/instagramMedia.ts with 
      instagramCircuitBreaker. Apply fetchWithTimeout to image downloads 
      and API calls. Ensure proper error handling and retry logic.
    agent: security_hardening_specialist
    expected_output: >
      All Instagram media service API calls protected with circuit breakers 
      and timeouts. No raw fetch() calls remain.
    context: []

  # Task 7: Verify TypeScript compilation
  verify_typescript:
    name: Verify TypeScript Compilation and Fix Errors
    description: >
      Run typecheck and build. Fix any TypeScript errors that arise from 
      new code. Ensure strict mode passes. Verify no implicit any types 
      remain. Check that all new files are included in tsconfig.json.
    agent: code_quality_lead
    expected_output: >
      TypeScript compilation succeeds with zero errors. Strict mode passes.
    context:
      - wire_jobscheduler
      - add_circuit_breakers
      - add_input_validation

  # Task 8: Final code quality review
  final_quality_review:
    name: Final Code Quality Review and Cleanup
    description: >
      Search entire src/ directory for remaining console.* calls and replace 
      with logger.*. Remove any dead code, commented-out sections, or 
      unused imports. Verify all error handling uses structured logging. 
      Ensure all public methods have JSDoc comments.
    agent: code_quality_lead
    expected_output: >
      Zero console.* calls in src/. All code meets quality standards. 
      Clean, production-ready codebase.
    context:
      - verify_typescript
      - write_utility_tests
      - write_integration_tests
# Keep the wa-transfer Hugging Face Space awake.
#
# Free HF Spaces sleep after ~48h without HTTP traffic, which would take the
# WhatsApp daemon offline. This workflow pings the Space's health endpoint every
# 30 minutes so it never sleeps.
#
# Setup: add a repository secret named HF_SPACE_URL with the Space's public URL,
# e.g. https://ehijiele1-wa-transfer.hf.space  (no trailing slash)

name: HF Space Keep-Alive

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Space health endpoint
        env:
          SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: |
          if [ -z "$SPACE_URL" ]; then
            echo "::warning::HF_SPACE_URL secret is not set — skipping ping"
            exit 0
          fi
          echo "Pinging $SPACE_URL/health ..."
          # First request may wake a sleeping Space (can take up to a minute)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$SPACE_URL/health" || echo "000")
          echo "Health status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Space health returned $code — check the Space logs"
          fi

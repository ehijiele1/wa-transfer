# Docker Compose Configuration for Production
version: '3.8'

services:
  wa-transfer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: wa-transfer
    restart: unless-stopped
    environment:
      # Runtime Configuration
      NODE_ENV: production
      PORT: 3001
      HEALTH_PORT: 3001
      
      # Database Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      
      # WhatsApp Configuration  
      WHATSAPP_SESSION_ID: ${WHATSAPP_SESSION_ID}
      WHATSAPP_RETRY_DELAY_MS: ${WHATSAPP_RETRY_DELAY_MS:-5000}
      WHATSAPP_MAX_RETRIES: ${WHATSAPP_MAX_RETRIES:-3}
      
      # AI Configuration
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}
      
      # Monitoring Configuration
      MONITORING_GROUPS: ${MONITORING_GROUPS}
      MAX_MESSAGES_PER_GROUP: ${MAX_MESSAGES_PER_GROUP:-100}
      MESSAGE_PROCESSING_INTERVAL_MS: ${MESSAGE_PROCESSING_INTERVAL_MS:-30000}
      CONTENT_GENERATION_INTERVAL_MS: ${CONTENT_GENERATION_INTERVAL_MS:-300000}
      SOCIAL_MEDIA_INTERVAL_MS: ${SOCIAL_MEDIA_INTERVAL_MS:-60000}
      
      # Social Media Configuration
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
      INSTAGRAM_ACCOUNT_ID: ${INSTAGRAM_ACCOUNT_ID}
      FACEBOOK_ACCESS_TOKEN: ${FACEBOOK_ACCESS_TOKEN}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN}
      
      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_CONSOLE_LOGGING: ${ENABLE_CONSOLE_LOGGING:-true}
      ENABLE_FILE_LOGGING: ${ENABLE_FILE_LOGGING:-true}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-/app/logs/app.log}
      ENABLE_TRACING: ${ENABLE_TRACING:-true}
      
      # Security Configuration
      ENABLE_HEALTH_SERVER: ${ENABLE_HEALTH_SERVER:-true}
      HEALTH_SERVER_PORT: ${HEALTH_SERVER_PORT:-3001}
      HEALTH_SERVER_HOST: ${HEALTH_SERVER_HOST:-0.0.0.0}
      ENABLE_CORS: ${ENABLE_CORS:-true}
      
    volumes:
      # Persistent data
      - wa-transfer-data:/app/data
      - wa-transfer-logs:/app/logs
      - wa-transfer-sessions:/app/wwebjs-auth
      
      # Read-only configuration mount (secrets managed externally)
      - ./docker/config:/app/config:ro
      
    ports:
      # Health check endpoint
      - "3001:3001"
      
    healthcheck:
      test: ["CMD", "/app/entrypoint.sh", "health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    networks:
      - wa-transfer-network
      
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
          
    # Security hardening
    security_opt:
      - no-new-privileges:true
      
    read_only: true
    tmpfs:
      - /tmp
      
    # User and group configuration
    user: "1000:1000"
    
    labels:
      - "traefik.enable=false"  # Disable Traefik if not using it
      - "com.docker.compose.project=wa-transfer"
      - "service.name=wa-transfer"
      - "service.version=1.0.0"

  # Optional: Database service (if using Supabase locally)
  # supabase:
  #   image: supabase/postgres:15.1
  #   container_name: wa-transfer-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: wa_transfer
  #     POSTGRES_USER: wa_transfer_user
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - wa-transfer-db-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - wa-transfer-network

  # Redis for job queues (required for BullMQ)
  redis:
    image: redis:7-alpine
    container_name: wa-transfer-redis
    restart: unless-stopped
    volumes:
      - wa-transfer-redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - wa-transfer-network
    command: redis-server --appendonly yes

volumes:
  wa-transfer-redis-data:
    driver: local
  wa-transfer-data:
    driver: local
  wa-transfer-logs:
    driver: local
  wa-transfer-sessions:
    driver: local
  # wa-transfer-db-data:
  #   driver: local
  # wa-transfer-redis-data:
  #   driver: local

networks:
  wa-transfer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16